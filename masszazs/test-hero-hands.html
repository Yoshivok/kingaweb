<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Hands Animation Test</title>
  <style>
    :root {
      --color-gold: #c9a96e;
      --color-gold-light: #f5efe4;
      --color-accent: #d67b4b;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #120e0b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero-mock {
      position: relative;
      width: 100%;
      height: 90vh;
      min-height: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(38% 34% at 50% 34%, rgba(214, 123, 75, 0.22), rgba(201, 169, 110, 0.05) 55%, transparent 78%) no-repeat,
        radial-gradient(circle at 50% 40%, #2b1d12 0%, #1c130d 55%, #140e0a 100%) no-repeat #1c130d;
      overflow: hidden;
    }
    .hero__inner {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 680px;
      padding: 0 20px;
      margin-top: -60px;
    }
    .kicker {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(250, 248, 245, 0.72);
      margin-bottom: 1.2rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      margin: 0 0 1.2rem;
      font-weight: 400;
      line-height: 1.1;
    }
    h1 em {
      font-style: italic;
      color: var(--color-gold);
    }
    p.lead {
      color: rgba(250, 248, 245, 0.78);
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      line-height: 1.7;
      margin: 0 auto 2rem;
      max-width: 54ch;
    }
    .actions {
      display: flex; gap: 12px; justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #c9a96e, #d67b4b);
      color: #140e0a;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(201, 169, 110, 0.25);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(250, 248, 245, 0.25);
      color: #fff;
      box-shadow: none;
    }

    /* ── HERO HANDS SYSTEM ── */
    .hero__hands {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      /* Soft center mask: keeps texts in hero__inner 100% crisp and readable */
      mask-image: radial-gradient(ellipse 70% 50% at 50% 30%, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.65) 50%, #000 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 30%, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.65) 50%, #000 80%);
    }
    .hero-hands__svg {
      width: min(100%, 1400px);
      height: clamp(340px, 48vw, 580px);
      margin-bottom: clamp(0.5rem, 3.5vw, 2.5rem);
      overflow: visible;
      perspective: 1200px;
      transform-style: preserve-3d;
      filter: drop-shadow(0 4px 24px rgba(201, 169, 110, 0.28));
    }

    /* Hand base state (off-screen / ready) */
    .hand--left {
      transform-origin: 180px 280px;
      opacity: 0;
      transform: translate3d(-560px, -45px, -80px) rotateY(-24deg) rotateZ(-12deg) rotateX(8deg);
      transition: opacity 0.4s ease;
      will-change: transform, opacity;
    }
    .hand--right {
      transform-origin: 1000px 450px;
      opacity: 0;
      transform: translate3d(560px, 50px, -80px) rotateY(26deg) rotateZ(14deg) rotateX(-6deg);
      transition: opacity 0.4s ease;
      will-change: transform, opacity;
    }
    .hand__touch-glow-wrap {
      opacity: 0;
      transform-origin: 605px 458px;
      transform: scale(0.3);
      will-change: transform, opacity;
    }

    /* ── ANIMATING STATE ── */
    .hero__hands.is-animating .hand--left {
      opacity: 1;
      animation: hand-enter-left 2.4s var(--ease) forwards;
    }
    .hero__hands.is-animating .hand--right {
      opacity: 1;
      animation: hand-enter-right 2.4s var(--ease) forwards;
    }
    .hero__hands.is-animating .hand__touch-glow-wrap {
      animation: touch-flare 2.4s ease-out forwards;
    }

    /* ── SETTLED IDLE (NO MOTION) ── */
    .hero__hands.is-settled .hand--left,
    .hero__hands.is-settled .hand--right {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition: transform 0.45s ease;
      animation: none;
    }
    .hero__hands.is-settled .hand__touch-glow-wrap {
      opacity: 0.35;
      animation: touch-breathe 6s ease-in-out infinite alternate;
    }

    /* ── RESONANCE FLASH & TOUCH MOTION ── */
    .hero__hands.is-resonating {
      opacity: 1;
    }
    .hero__hands.is-resonating .hand__touch-glow-wrap {
      animation: touch-resonate 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }
    .hero__hands.is-resonating:not(.is-animating) .hand--left {
      animation: hand-resonate-left 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }
    .hero__hands.is-resonating:not(.is-animating) .hand--right {
      animation: hand-resonate-right 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }

    @keyframes touch-resonate {
      0% { opacity: 0.5; transform: scale(1); }
      30% { opacity: 1; transform: scale(2.4); }
      65% { opacity: 0.85; transform: scale(1.4); }
      100% { opacity: 0.35; transform: scale(1); }
    }
    @keyframes hand-resonate-left {
      0% { transform: translate3d(0, 0, 0); }
      30% { transform: translate3d(9px, 1.8px, 0); }
      65% { transform: translate3d(2px, 0.4px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes hand-resonate-right {
      0% { transform: translate3d(0, 0, 0); }
      30% { transform: translate3d(-9px, -1.8px, 0); }
      65% { transform: translate3d(-2px, -0.4px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    /* ── KEYFRAMES: NATURAL MULTI-AXIS LIVING MOTION ── */
    @keyframes hand-enter-left {
      0% {
        opacity: 0;
        transform: translate3d(-580px, -45px, -100px) rotateY(-26deg) rotateZ(-13deg) rotateX(8deg);
      }
      25% {
        opacity: 1;
      }
      65% {
        transform: translate3d(-24px, -5px, -10px) rotateY(-5deg) rotateZ(-2deg) rotateX(1deg);
      }
      85% {
        transform: translate3d(6px, 1px, 4px) rotateY(1deg) rotateZ(0.5deg) rotateX(0deg);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg) rotateX(0deg);
      }
    }

    @keyframes hand-enter-right {
      0% {
        opacity: 0;
        transform: translate3d(580px, 50px, -100px) rotateY(28deg) rotateZ(15deg) rotateX(-6deg);
      }
      25% {
        opacity: 1;
      }
      65% {
        transform: translate3d(24px, 5px, -10px) rotateY(5deg) rotateZ(2deg) rotateX(-1deg);
      }
      85% {
        transform: translate3d(-6px, -1px, 4px) rotateY(-1deg) rotateZ(-0.5deg) rotateX(0deg);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg) rotateX(0deg);
      }
    }

    @keyframes touch-flare {
      0%, 68% {
        opacity: 0;
        transform: scale(0.2);
      }
      84% {
        opacity: 0.95;
        transform: scale(1.4);
      }
      92% {
        opacity: 0.6;
        transform: scale(1.1);
      }
      100% {
        opacity: 0.35;
        transform: scale(1);
      }
    }

    /* Idle loops */
    @keyframes hand-breathe-left {
      0%   { transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg); }
      100% { transform: translate3d(2px, -6px, 0) rotateY(-1.2deg) rotateZ(0.5deg); }
    }
    @keyframes hand-breathe-right {
      0%   { transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg); }
      100% { transform: translate3d(-2px, 5px, 0) rotateY(1.2deg) rotateZ(-0.4deg); }
    }
    @keyframes touch-breathe {
      0%   { opacity: 0.25; transform: scale(0.92); }
      100% { opacity: 0.50; transform: scale(1.12); }
    }

    /* Pause in background */
    .hero-mock.is-paused .hero__hands * {
      animation-play-state: paused !important;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .hand--left, .hand--right, .hand__touch-glow-wrap {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .hand__touch-glow-wrap { opacity: 0.35 !important; }
    }

    .controls {
      margin: 24px 0;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      background: var(--color-gold);
      color: #140e0a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="hero-mock" id="heroMock">
    <div class="hero__inner">
      <p class="kicker">Gyógymasszázs · Rehabilitáció · Budapest</p>
      <h1>A gyógyuláshoz vezető út<br><em>megbízható kezekben</em></h1>
      <p class="lead">Gyógyászati alapokon végzett rehabilitációs kezelések, fájdalomra mozgásszervi panaszokra — minden esetben személyreszabottan és az ellenjavallatok átbeszélésével.</p>
      <div class="actions">
        <a href="#" class="btn">Időpontot kérek</a>
        <a href="#" class="btn btn-ghost">Kezelések megtekintése</a>
      </div>
    </div>

    <div class="hero__hands is-animating" id="heroHands" aria-hidden="true">
      <svg class="hero-hands__svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Arany gradiens a bal kéznek (balról jobbra mélyülő homokarany) -->
    <linearGradient id="hand-gold-left" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ebdcd0" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#f5efe4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d67b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Arany gradiens a jobb kéznek (jobbról balra mélyülő homokarany) -->
    <linearGradient id="hand-gold-right" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ebdcd0" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#f5efe4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d67b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Érintési gyógyító fényfolt gradiens -->
    <radialGradient id="touch-glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3dd" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#c9a96e" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#d67b4b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d67b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Finom meleg fényudvar szűrő -->
    <filter id="hand-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
  </defs>

  <!-- Érintés fénypont (ahol a bal ujjak a jobb tenyérbe érnek) -->
  <g class="hand__touch-glow-wrap">
    <circle class="hand__touch-glow" cx="605" cy="458" r="80" fill="url(#touch-glow-grad)" />
    <circle class="hand__touch-core" cx="605" cy="458" r="14" fill="#fff" opacity="0.7" />
  </g>

  <div class="controls">
    <button onclick="replay()">Animáció újraindítása (Replay)</button>
    <button onclick="triggerFlash()">Felvillanás + Érintés effekt teszt</button>
  </div>

  <script>
    const el = document.getElementById('heroHands');
    let resTimer = null;

    el.addEventListener('animationend', (ev) => {
      if (ev.animationName === 'hand-enter-left') {
        el.classList.remove('is-animating');
        el.classList.add('is-settled');
      }
    });

    function replay() {
      el.classList.remove('is-settled');
      el.classList.remove('is-animating');
      el.classList.remove('is-resonating');
      void el.offsetWidth;
      el.classList.add('is-animating');
    }

    function triggerFlash() {
      el.classList.remove('is-resonating');
      void el.offsetWidth;
      el.classList.add('is-resonating');
      clearTimeout(resTimer);
      resTimer = setTimeout(() => {
        el.classList.remove('is-resonating');
      }, 850);
    }

    document.getElementById('heroMock').addEventListener('pointerdown', (ev) => {
      if (ev.target && ev.target.closest && ev.target.closest('a, button')) return;
      triggerFlash();
    });
  </script>
